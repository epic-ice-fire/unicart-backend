name: Dual Email Notifications

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dual-email-notifications.yml
      - scripts/apply_dual_email_patch.py

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: development
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      SECRET_KEY: dual-email-ci-secret-key-long-enough-for-tests
      DEBUG_RETURN_PAU_CODE: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply patch
        run: python scripts/apply_dual_email_patch.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Run security preflight
        run: python scripts/security_preflight.py

      - name: Commit verified rollout
        shell: bash
        run: |
          rm .github/workflows/dual-email-notifications.yml
          rm scripts/apply_dual_email_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Send operational notifications to both verified emails"
          git push origin HEAD:main
